services:
  # Ollama - Self-hosted LLM server
  # Exposes OpenAI-compatible API at http://localhost:11434/v1
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Context size (number of tokens). Default is 4096 if not set.
      # gemma3:12b supports up to 131k tokens, qwen3:14b supports up to 40k tokens.
      # Set to 40960 to match qwen3:14b's maximum (can be overridden via OLLAMA_NUM_CTX env var).
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-40960}
      # Keep-alive duration: how long models stay loaded after last use.
      # Set to "0" to unload immediately, or a duration like "30s", "1m", "5m" (default is 5m).
      # This helps free GPU/CPU when the application stops.
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30s}
    # GPU support (requires nvidia-container-toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Qdrant - Vector similarity search engine
  # Used by knowledge-base for semantic source/article search
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # Knowledge-base API server
  # Provides source storage and vector search for researcher
  knowledge-base:
    build:
      context: ../../knowledge-base
      dockerfile: Dockerfile
    container_name: knowledge-base
    ports:
      - "8081:8081"
    depends_on:
      - qdrant
      - ollama
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - OLLAMA_URL=http://ollama:11434
      - KB_PORT=8081
    volumes:
      - kb_data:/app/data

  researcher:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: researcher
    depends_on:
      - ollama
      - knowledge-base
    env_file:
      - ../.env
    environment:
      - LLM_BASE_URL=http://ollama:11434/v1
      - KB_API_URL=http://knowledge-base:8081

volumes:
  ollama_data:
  qdrant_data:
  kb_data:
