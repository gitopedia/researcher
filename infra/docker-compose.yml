services:
  # Ollama - Self-hosted LLM (DeepSeek)
  # Exposes OpenAI-compatible API at http://localhost:11434/v1
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Context size (number of tokens). Default is 4096, increase for longer context.
      # DeepSeek models support up to 32k tokens. Recommended: 8192-16384 for research tasks.
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-32768}
    # GPU support (requires nvidia-container-toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  researcher:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: researcher
    depends_on:
      - ollama
    env_file:
      - ../.env
    environment:
      - OPENAI_BASE_URL=http://ollama:11434/v1

volumes:
  ollama_data:
