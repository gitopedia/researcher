# Artistic Styles Configuration for Image Generation
# Hierarchical structure: image_type -> category -> subcategory -> styles
# Styles are inherited from parent levels if not specified at a lower level

# Global configuration applied to all image generation
global:
  # Negative prompts - always included in the system prompt to avoid unwanted elements
  negative_prompts:
    - do not use neon glowing effects
    - avoid vibrant neon colours
    - avoid photorealistic human faces
    - no watermarks or text overlays
    - no text, words, letters, numbers, or typography of any kind
    - avoid cluttered or busy compositions
  
  # Positive prompts - 0, 1, or 2 randomly selected and added to each image
  positive_prompts:
    - bauhaus design influence
    - high contrast and visual clarity
    - subtle texture and depth
  
  # Number of image candidates to generate per request
  candidate_count: 10
  
  # Background mode: "dark", "light", or "random" (50/50 chance)
  background_mode: random
  
  # Background guidance text for dark mode
  dark_background_guidance: |
    Design for a dark background aesthetic.
  
  # Background guidance text for light mode
  light_background_guidance: |
    Design for a light background aesthetic.

