# Artistic Styles Configuration
# Hierarchical style config by image type, category, and subcategory
#
# Resolution order:
# 1. categories.<Category>.subcategories.<Subcategory>.<imageType>
# 2. categories.<Category>.<imageType>
# 3. default.<imageType>

# Default styles used when no category/subcategory match
default:
  header:
    - bauhaus design
    - minimalist flat vector
    - modern geometric abstract
    - clean contemporary illustration
    - bold graphic design

