# Image Prompt Templates Configuration
# Category-specific prompt structures, guidance, and suggested elements

# Default template for uncategorized topics
default:
  header:
    template: >
      An abstract digital illustration depicting {{.Topic}}, 
      featuring {{.KeyElements}}, 
      with a {{.ColorMood}} palette in a modern {{.ArtStyle}}.
    guidance: |
      Use abstract, modern visuals. Focus on symbolic representation.
      Include geometric shapes and clean lines.
      Avoid photorealistic imagery - prefer stylized, artistic interpretations.
    suggested_elements:
      - symbolic icons
      - geometric patterns
      - abstract shapes
      - flowing lines
      - depth layers
    color_moods:
      - "deep charcoal with vibrant accents"
      - "midnight blue gradient"
      - "dark slate with warm highlights"
      - "moody purple-gray tones"
      - "obsidian with neon accent"

# Science category
science:
  header:
    template: >
      A {{.ArtStyle}} visualization of {{.Topic}} in the realm of science,
      incorporating {{.KeyElements}},
      rendered with a {{.ColorMood}} color scheme.
    guidance: |
      Emphasize scientific accuracy while maintaining artistic appeal.
      Use visual metaphors for complex concepts.
      Include recognizable scientific symbols where appropriate.
      Balance technical precision with aesthetic beauty.
    suggested_elements:
      - laboratory equipment silhouettes
      - molecular structures
      - wave patterns
      - data visualization elements
      - scientific notation
    color_moods:
      - "deep ocean blue with clinical highlights"
      - "dark lab with fluorescent glow"
      - "deep space dark with bright accents"
      - "charcoal microscopy with silver details"
      - "dark plasma energy swirls"

  physics:
    header:
      template: >
        A {{.ArtStyle}} representation of {{.Topic}} in physics,
        visualizing {{.KeyElements}},
        with {{.ColorMood}} tones that evoke quantum phenomena.
      guidance: |
        Visualize abstract physics concepts through artistic interpretation.
        Use wave-particle duality imagery where relevant.
        Include mathematical elements as visual motifs.
        Show energy, motion, and fundamental forces symbolically.
        Reference specific phenomena mentioned in the article.
      suggested_elements:
        - wave functions
        - particle trajectories
        - field lines
        - interference patterns
        - energy level diagrams
        - Feynman diagram aesthetics
      color_moods:
        - "deep quantum blue with glowing probability clouds"
        - "dark void with particle collision sparks"
        - "midnight wave interference patterns"
        - "dark matter deep purple"
        - "dark field with electromagnetic spectrum traces"

  biology:
    header:
      template: >
        A {{.ArtStyle}} illustration of {{.Topic}} in biology,
        featuring {{.KeyElements}},
        with an {{.ColorMood}} organic palette.
      guidance: |
        Emphasize organic forms and natural patterns.
        Use cellular and molecular imagery.
        Include life cycle and growth metaphors.
        Balance scientific accuracy with artistic interpretation.
      suggested_elements:
        - cell structures
        - DNA helices
        - organic growth patterns
        - ecosystem connections
        - anatomical details
      color_moods:
        - "bioluminescent glow on dark water"
        - "deep forest chlorophyll greens"
        - "dark field microscopy with bright cells"
        - "deep crimson and dark tissue tones"
        - "deep oceanic blues with luminescent life"

  chemistry:
    header:
      template: >
        A {{.ArtStyle}} visualization of {{.Topic}} in chemistry,
        showing {{.KeyElements}},
        with a {{.ColorMood}} reaction-inspired palette.
      guidance: |
        Focus on molecular interactions and chemical bonds.
        Use crystalline and geometric structures.
        Include reaction dynamics and transformations.
        Show the beauty of chemical processes.
      suggested_elements:
        - molecular models
        - electron orbitals
        - crystal lattices
        - reaction arrows
        - periodic table elements
      color_moods:
        - "dark lab with flame test spectrum glow"
        - "deep vessel with pH indicator gradient"
        - "dark alloy with metallic sheens"
        - "blackout with gas discharge tube colors"
        - "dark solution with luminous layers"

  astronomy:
    header:
      template: >
        A {{.ArtStyle}} cosmic visualization of {{.Topic}},
        featuring {{.KeyElements}},
        set against {{.ColorMood}} stellar backdrop.
      guidance: |
        Capture the grandeur and scale of cosmic phenomena.
        Use actual celestial imagery as inspiration.
        Include astronomical distance and time concepts.
        Balance scientific accuracy with awe-inspiring visuals.
      suggested_elements:
