# Image Prompt Templates Configuration
# Category-specific prompt structures with guidance, elements, and moods
#
# Resolution order (with merging):
# 1. Start with default.<imageType>
# 2. Merge categories.<Category>.<imageType>
# 3. Merge categories.<Category>.subcategories.<Subcategory>.<imageType>
#
# Fields:
# - template: The prompt structure with placeholders
# - guidance: Instructions for the LLM on visual language
# - suggested_elements: Domain-specific visual elements (merged from all levels)
# - color_moods: Appropriate color palettes (overridden at each level)

# Default template for uncategorized topics
default:
  header:
    template: >
      An abstract digital illustration depicting {{.Topic}}, 
      featuring {{.KeyElements}}, 
      with a {{.ColorMood}} palette in a modern {{.ArtStyle}}.
    guidance: |
      Create a visually striking header image for an encyclopedia article.
      Use abstract, modern visuals with symbolic representation of the topic.
      Include geometric shapes, clean lines, and professional aesthetics.
      The image should be suitable as a 1920x1080 header banner.
    suggested_elements:
      - symbolic icons
      - geometric patterns
      - abstract shapes
      - clean typography elements
    color_moods:
      - "bold and minimal color scheme"
      - "muted earth tones with accent color"
      - "monochromatic with vibrant accent"
      - "professional blue and white palette"

# Category-specific configurations
categories:
  Science:
    header:
      template: >
        An abstract digital illustration depicting {{.Topic}}, 
        featuring {{.KeyElements}}, 
        with a {{.ColorMood}} palette in a {{.ArtStyle}}.
      guidance: |
        For scientific topics, use abstract and futuristic visuals that convey complexity and innovation.
        Include imagery like particles, waves, circuits, or laboratory elements.
        Render with a modern look - glowing neon effects on dark backgrounds work exceptionally well.
        The style should be clean and high-tech, emphasizing the precision and wonder of science.
        Avoid overly literal representations; prefer symbolic and abstract interpretations.
      suggested_elements:
        - subatomic particles
        - wave interference patterns
        - circuit traces
        - molecular structures
        - energy fields
        - data visualization elements
        - laboratory glassware silhouettes
      color_moods:
        - "dark background with glowing neon-blue accents"
        - "deep space purple with electric cyan highlights"
        - "clean white with vibrant accent colors"
        - "midnight blue with particle light trails"
    subcategories:
