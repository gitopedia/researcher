# Image Prompt Templates Configuration
# Category-specific prompt structures, guidance, and suggested elements

# Default template for uncategorized topics
default:
  header:
    template: >
      An abstract digital illustration depicting {{.Topic}}, 
      featuring {{.KeyElements}}, 
      with a {{.ColorMood}} palette in a modern {{.ArtStyle}}.
    guidance: |
      Use abstract, modern visuals. Focus on symbolic representation.
      Include geometric shapes and clean lines.
      Avoid photorealistic imagery - prefer stylized, artistic interpretations.
    suggested_elements:
      - symbolic icons
      - geometric patterns
      - abstract shapes
      - flowing lines
      - depth layers
    color_moods:
      - "bold and minimal"
      - "muted earth tones"
      - "monochromatic with accent"
      - "gradient spectrum"
      - "high contrast duotone"

# Science category
science:
  header:
    template: >
      A {{.ArtStyle}} visualization of {{.Topic}} in the realm of science,
      incorporating {{.KeyElements}},
      rendered with a {{.ColorMood}} color scheme.
    guidance: |
      Emphasize scientific accuracy while maintaining artistic appeal.
      Use visual metaphors for complex concepts.
      Include recognizable scientific symbols where appropriate.
      Balance technical precision with aesthetic beauty.
    suggested_elements:
      - laboratory equipment silhouettes
      - molecular structures
      - wave patterns
      - data visualization elements
      - scientific notation
    color_moods:
      - "clinical blues and whites"
      - "laboratory fluorescent"
      - "deep space dark with bright accents"
      - "electron microscope grayscale"
      - "plasma energy colors"

  physics:
    header:
      template: >
        A {{.ArtStyle}} representation of {{.Topic}} in physics,
        visualizing {{.KeyElements}},
        with {{.ColorMood}} tones that evoke quantum phenomena.
      guidance: |
        Visualize abstract physics concepts through artistic interpretation.
        Use wave-particle duality imagery where relevant.
        Include mathematical elements as visual motifs.
        Show energy, motion, and fundamental forces symbolically.
        Reference specific phenomena mentioned in the article.
      suggested_elements:
        - wave functions
        - particle trajectories
        - field lines
        - interference patterns
        - energy level diagrams
        - Feynman diagram aesthetics
      color_moods:
        - "quantum blue with probability clouds"
        - "particle collision energy spectrum"
        - "wave interference rainbow"
        - "dark matter deep purple"
        - "electromagnetic spectrum gradient"

  biology:
    header:
      template: >
        A {{.ArtStyle}} illustration of {{.Topic}} in biology,
        featuring {{.KeyElements}},
        with an {{.ColorMood}} organic palette.
      guidance: |
        Emphasize organic forms and natural patterns.
        Use cellular and molecular imagery.
        Include life cycle and growth metaphors.
        Balance scientific accuracy with artistic interpretation.
      suggested_elements:
        - cell structures
        - DNA helices
        - organic growth patterns
        - ecosystem connections
        - anatomical details
      color_moods:
        - "bioluminescent blue-green"
        - "chlorophyll greens"
        - "cellular microscopy tints"
        - "blood and tissue warm tones"
